name: build-wasm

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build wasm artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache pinned inputs and build state
        uses: actions/cache@v4
        with:
          path: |
            build/cache
            build/deps
            vendor/libfive
          key: libfive-wasm-${{ runner.os }}-${{ hashFiles('vendor/libfive.lock', 'vendor/patches/*', 'scripts/deps.lock') }}
          restore-keys: |
            libfive-wasm-${{ runner.os }}-

      # Installed before the build so build-wasm.sh runs the golden mesh
      # suite against the artifact it just linked (AD-025).
      - name: Install package dev dependencies
        run: npm ci

      - name: Build and test
        run: bash scripts/build-wasm.sh

      - name: Package test suite
        run: npm test

      - name: Report artifact digest
        if: always()
        run: |
          if [ -f dist/libfive.wasm ]; then
            digest="$(sha256sum dist/libfive.wasm | awk '{print $1}')"
            size="$(wc -c < dist/libfive.wasm | awk '{print $1}')"
            {
              echo "### libfive.wasm"
              echo ""
              echo "- size: ${size} bytes"
              echo "- sha256: \`${digest}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libfive-wasm
          path: dist
          if-no-files-found: error
