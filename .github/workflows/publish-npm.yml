name: publish-npm

# Publishes the npm module when a version tag matching package.json is pushed.
#
# Publishing uses npm trusted publishing (OIDC) — no NPM_TOKEN secret. The npm
# package must be configured on the npm side to trust this repository's
# workflow and the `npm` GitHub environment before the first tag is pushed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json ${version}"
            exit 1
          fi

      - name: Install dev dependencies
        run: npm ci

      - name: Build
        run: |
          if [ -f scripts/build-wasm.sh ]; then
            bash scripts/build-wasm.sh
          else
            echo "::error::scripts/build-wasm.sh is missing — cannot publish."
            exit 1
          fi

      - name: Package test suite
        run: npm test

      - name: Consumer package test
        run: npm run test:package

      - name: Publish
        run: npm publish --access public --provenance
