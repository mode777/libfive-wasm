# scripts/deps.lock — pinned header-only dependencies for the wasm build
# (AD-016, AD-021). Consumed by scripts/fetch-deps.sh.
#
# Format: tab-separated columns, one dependency per row, `#` starts a comment.
#
#   id            short name used on the command line and for build/deps/<id>
#   version       pinned upstream release
#   url           archive URL (must be https)
#   sha256        SHA-256 of the archive bytes; verified before extraction
#   dest          extraction directory, relative to the repository root
#   archive_root  top-level directory inside the archive (stripped on extract)
#   members       comma-separated archive paths to extract (relative to root)
#   sentinel      file that must exist in the extracted tree (used by --check)
#
# All entries are header-only libraries: no compiled dependency source is
# downloaded or built. Bump a pin by editing the row (url + sha256 + version)
# and re-running scripts/fetch-deps.sh --force; see vendor/VENDOR.md for the
# overall pin-bump procedure.

